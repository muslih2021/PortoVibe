<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PortoVibe | Luxury Portfolios</title>
  <meta name="description" content="Generate premium portfolios from your CV in seconds with AI.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&family=Sora:wght@900&display=swap" rel="stylesheet">
  <style>
    /* Match SplashScreen.jsx exactly */
    #initial-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }

    /* Match LoadingEffect container: padding 2rem, flex column center */
    .il-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    /* Match LoadingEffect lottie wrapper: size*2 = 150*2 = 300px */
    .il-img {
      width: 300px;
      height: 300px;
      object-fit: contain;
    }

    /* Match LoadingEffect text exactly */
    .il-text {
      margin-top: 1rem;
      font-size: 1.1rem;
      font-weight: 900;
      background: linear-gradient(to right, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: 'Outfit', 'Sora', sans-serif;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0;
      animation: il-fadeInUp 0.8s forwards 1.2s;
    }

    @keyframes il-fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="initial-loader">
      <div class="il-content">
        <img class="il-img" src="/cat-loading_20260503063207.gif" alt="Loading..." />
        <p class="il-text">PortoVibe By Muslih</p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
